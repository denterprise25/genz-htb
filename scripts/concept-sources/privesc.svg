<svg class="ca-privesc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" fill="none" role="img" aria-labelledby="pe-title pe-desc">
  <title id="pe-title">Privilege escalation: a permission boundary crossed</title>
  <desc id="pe-desc">An orange access token starts on a low user platform. A loose permission latch exposes a route through a middle tier. When the gate opens, the token travels up the bridge to a raised administrator platform.</desc>
  <style>
    .ca-privesc .pe-edge{stroke:var(--ca-ink,#343d30);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .ca-privesc .pe-fine{stroke:var(--ca-deep,#899d78);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
    .ca-privesc :is(.pe-token-position,.pe-gate-arm,.pe-latch,.pe-bridge,.pe-route,.pe-admin,.pe-alert){transition:transform 1.25s cubic-bezier(.4,0,.2,1),opacity .65s ease,fill .65s ease,stroke .65s ease}
    .ca-privesc .pe-token-position{transform:translate(0,0)}
    .ca-privesc .pe-bridge{transform:translate(-22px,13px);opacity:.2}
    .ca-privesc .pe-route{opacity:.12}
    .ca-privesc .pe-gate-arm{transform-origin:289px 216px}
    .ca-privesc .pe-latch{transform-origin:319px 231px;fill:var(--ca-mid,#b8c3a7)}
    .ca-privesc .pe-alert{opacity:0;transform:translateY(6px)}
    .ca-privesc .pe-admin{fill:var(--ca-deep,#899d78)}
    .ca-product[data-step="1"] .ca-privesc .pe-token-position{transform:translate(49px,-28px)}
    .ca-product[data-step="1"] .ca-privesc .pe-latch{transform:rotate(31deg);fill:var(--ca-orange,#f15332)}
    .ca-product[data-step="1"] .ca-privesc .pe-alert{opacity:1;transform:translateY(0)}
    .ca-product[data-step="1"] .ca-privesc .pe-bridge,.ca-product[data-step="2"] .ca-privesc .pe-bridge{transform:translate(0,0);opacity:1}
    .ca-product[data-step="1"] .ca-privesc .pe-route{opacity:.55}
    .ca-product[data-step="2"] .ca-privesc .pe-route{opacity:1}
    .ca-product[data-step="2"] .ca-privesc .pe-token-position{transform:translate(272px,-157px)}
    .ca-product[data-step="2"] .ca-privesc .pe-gate-arm{transform:rotate(-78deg)}
    .ca-product[data-step="2"] .ca-privesc .pe-latch{transform:rotate(75deg);fill:var(--ca-orange,#f15332)}
    .ca-product[data-step="2"] .ca-privesc .pe-admin{fill:var(--ca-orange,#f15332)}
    .ca-privesc .pe-signal{stroke-dasharray:4 8;animation:pe-flow calc(2.4s / var(--ca-speed,1)) linear infinite}
    .ca-privesc .pe-led{animation:pe-blink calc(3.3s / var(--ca-speed,1)) ease-in-out infinite}
    .ca-privesc .pe-led-b{animation-delay:calc(-1.1s / var(--ca-speed,1))}
    .ca-privesc .pe-led-c{animation-delay:calc(-2.2s / var(--ca-speed,1))}
    .ca-privesc .pe-ring{transform-origin:185px 302px;animation:pe-breathe calc(2.8s / var(--ca-speed,1)) ease-in-out infinite}
    .ca-product[data-playing="false"] .ca-privesc *{animation-play-state:paused!important}
    @keyframes pe-flow{to{stroke-dashoffset:-48}}
    @keyframes pe-blink{0%,100%{opacity:.3}40%,65%{opacity:1}}
    @keyframes pe-breathe{0%,100%{opacity:.25;transform:scale(.94)}50%{opacity:.8;transform:scale(1.06)}}
    @media(prefers-reduced-motion:reduce){.ca-privesc *{animation:none!important;transition:none!important}}
  </style>

  <!-- Survey marks frame three physically different access levels. -->
  <g stroke="var(--ca-line,#c6c9b9)" stroke-width="1">
    <ellipse cx="334" cy="234" rx="274" ry="151" transform="rotate(-15 334 234)"/>
    <path d="m63 282 349-202 195 113-348 202Z" stroke-dasharray="3 8"/>
    <path d="M77 202h16m-8-8v16M573 284h16m-8-8v16M371 61h12m-6-6v12"/>
    <path d="m123 205 26-15m-20 22 26-15m373 159 29-17m-23 24 29-17"/>
  </g>

  <!-- Low, open user deck. -->
  <g class="pe-edge">
    <path d="m89 302 96-56 96 56-96 56Z" fill="var(--ca-light,#e0e5d3)"/>
    <path d="m89 302 96 56v24l-96-56Z" fill="var(--ca-mid,#b8c3a7)"/>
    <path d="m185 358 96-56v24l-96 56Z" fill="var(--ca-deep,#899d78)"/>
    <path d="m103 302 82-47 82 47-82 47Z" stroke="var(--ca-deep,#899d78)" stroke-width=".8"/>
    <path d="m102 319 40 23m-40-17 27 16" class="pe-fine"/>
    <path d="m199 357 26-15v8l-26 15Z" fill="var(--ca-ink,#343d30)"/>
    <path d="m205 356 12-7" stroke="var(--ca-orange,#f15332)" stroke-width="2"/>
    <ellipse class="pe-led" cx="165" cy="358" rx="2.5" ry="3.2" fill="var(--ca-orange,#f15332)" stroke="none"/>
    <path d="m113 294 12-7 16 9m56-29 17 10 11-7" class="pe-fine"/>
  </g>

  <!-- The taller middle tier exposes a mechanical permission boundary. -->
  <g class="pe-edge">
    <path d="m270 217 75-43 75 43-75 44Z" fill="var(--ca-paper,#eeece2)"/>
    <path d="m270 217 75 44v62l-75-44Z" fill="var(--ca-mid,#b8c3a7)"/>
    <path d="m345 261 75-44v62l-75 44Z" fill="var(--ca-deep,#899d78)"/>
    <path d="m282 217 63-36 63 36-63 37Z" stroke="var(--ca-deep,#899d78)" stroke-width=".8"/>
    <path d="m281 239 49 28m-49-18 49 28m-49-18 30 17" class="pe-fine"/>
    <path d="m357 265 49-28v35l-49 28Z" fill="var(--ca-mid,#b8c3a7)"/>
    <path d="m364 268 11-6v13l-11 6Zm18-10 17-10v6l-17 10Z" fill="var(--ca-ink,#343d30)"/>
    <ellipse class="pe-led pe-led-b" cx="393" cy="267" rx="2.3" ry="3.3" fill="var(--ca-orange,#f15332)" stroke="none"/>
    <path d="m296 209 17-10 15 9m37 25 15-9 14 8" class="pe-fine"/>
  </g>

  <!-- A column supporting the high administrator deck makes elevation tangible. -->
  <g class="pe-edge">
    <path d="m412 132 70-41 70 41-70 41Z" fill="var(--ca-light,#e0e5d3)"/>
    <path d="m412 132 70 41v96l-70-41Z" fill="var(--ca-mid,#b8c3a7)"/>
    <path d="m482 173 70-41v96l-70 41Z" fill="var(--ca-deep,#899d78)"/>
    <path d="m412 151 70 41 70-41m-140 47 70 41 70-41" stroke="var(--ca-deep,#899d78)" stroke-width="1"/>
    <path d="m425 153 42 24v47l-42-24Z" fill="var(--ca-light,#e0e5d3)"/>
    <path d="m433 169 26 15m-26-7 26 15m-26-7 26 15" class="pe-fine"/>
    <path d="m496 183 40-23v43l-40 23Z" fill="var(--ca-ink,#343d30)"/>
    <path d="m503 186 5-3m6-3 5-3m6-3 5-3m-27 18 27-16m-27 25 17-10" stroke="var(--ca-mid,#b8c3a7)" stroke-width="1.2"/>
    <ellipse class="pe-led pe-led-c" cx="517" cy="225" rx="2.4" ry="3.1" fill="var(--ca-orange,#f15332)" stroke="none"/>
    <path d="m424 132 58-34 58 34-58 34Z" stroke="var(--ca-deep,#899d78)" stroke-width=".8"/>
  </g>

  <!-- Extendible bridge plates form a single upward route. -->
  <g class="pe-bridge pe-edge">
    <path d="m224 280 69-64 38 22-69 64Z" fill="var(--ca-light,#e0e5d3)"/>
    <path d="m224 280 38 22v8l-38-22Zm38 22 69-64v8l-69 64Z" fill="var(--ca-deep,#899d78)"/>
    <path d="m235 280 58-54 27 15m-76 31 27 16m-16-26 27 16m-16-26 27 16m-16-26 27 16" class="pe-fine"/>
    <path d="m369 197 68-64 35 20-68 64Z" fill="var(--ca-light,#e0e5d3)"/>
    <path d="m369 197 35 20v8l-35-20Zm35 20 68-64v8l-68 64Z" fill="var(--ca-deep,#899d78)"/>
    <path d="m381 196 57-53 24 14m-72 29 25 14m-14-25 25 14m-14-25 25 14m-14-25 25 14" class="pe-fine"/>
  </g>
  <g class="pe-route" stroke="var(--ca-orange,#f15332)" stroke-width="1.8" stroke-linecap="round">
    <path class="pe-signal" d="M186 300 241 278 309 230 345 215 389 199 453 145"/>
    <path d="m178 300 8-5 8 5-8 5Zm159-85 8-5 8 5-8 5Zm108-70 8-5 8 5-8 5Z" fill="var(--ca-paper,#eeece2)"/>
  </g>

  <!-- A real hinged barrier: one upright post, striped arm, and loose latch. -->
  <g class="pe-edge">
    <path d="m279 238 11-6 10 6-11 7Z" fill="var(--ca-light,#e0e5d3)"/>
    <path d="m284 238 5 3 5-3v-34l-5-3-5 3Z" fill="var(--ca-mid,#b8c3a7)"/>
    <path d="m289 207 5-3v34l-5 3Z" fill="var(--ca-deep,#899d78)"/>
    <path d="m319 260 9-5 9 5-9 5Z" fill="var(--ca-light,#e0e5d3)"/>
    <path d="m324 259 4 3 4-3v-28l-4-2-4 2Z" fill="var(--ca-mid,#b8c3a7)"/>
    <g class="pe-gate-arm">
      <path d="m289 210 39 22v10l-39-22Z" fill="var(--ca-paper,#eeece2)"/>
      <path d="m296 214 7 4v10l-7-4Zm14 8 7 4v10l-7-4Z" fill="var(--ca-ink,#343d30)" stroke="none"/>
      <ellipse cx="289" cy="216" rx="3.2" ry="4" fill="var(--ca-orange,#f15332)"/>
    </g>
    <path class="pe-latch" d="m319 227 13 7v5l-13-7Z"/>
  </g>
  <g class="pe-alert" stroke="var(--ca-orange,#f15332)" stroke-width="1.6" stroke-linecap="round">
    <ellipse cx="329" cy="235" rx="19" ry="24" stroke-dasharray="2 5"/>
    <path d="M349 222l12-5m-16-6 7-11m1 34h13"/>
  </g>

  <!-- Raised access controller on the high deck: a privilege chip, not a trophy. -->
  <g class="pe-edge">
    <path d="m468 112 27-16 32 18-27 16Z" fill="var(--ca-ink,#343d30)"/>
    <path d="m468 112 32 18v6l-32-18Zm32 18 27-16v6l-27 16Z" fill="var(--ca-deep,#899d78)"/>
    <path d="m476 110 19-11 24 14-19 11Z" class="pe-admin"/>
    <path d="m483 110 12-7 16 9-12 7Z" fill="var(--ca-paper,#eeece2)" stroke-width="1"/>
    <path d="m470 103-7-4m14 0-7-4m14 0-7-4m26 3 6-4m1 8 6-4m1 8 6-4m1 13 7 4m-14 0 7 4m-14 0 7 4" stroke="var(--ca-ink,#343d30)" stroke-width="1.7"/>
  </g>

  <!-- One access token changes position; no duplicated or ghost tokens. -->
  <g class="pe-token-position">
    <ellipse class="pe-ring" cx="185" cy="302" rx="29" ry="16" stroke="var(--ca-orange,#f15332)" stroke-width="1.2"/>
    <g class="pe-edge">
      <ellipse cx="185" cy="303" rx="19" ry="11" fill="var(--ca-deep,#899d78)"/>
      <path d="M166 296v7c0 6 8.5 11 19 11s19-5 19-11v-7" fill="var(--ca-mid,#b8c3a7)"/>
      <ellipse cx="185" cy="296" rx="19" ry="11" fill="var(--ca-light,#e0e5d3)"/>
      <path d="m173 248 21-12 7 4v51l-21 12-7-4Z" fill="var(--ca-deep,#899d78)"/>
      <path d="m180 252 21-12v51l-21 12Z" fill="var(--ca-orange,#f15332)"/>
      <path d="m180 252-7-4m7 4v51"/>
      <path d="m185 255 11-6v10l-11 6Z" fill="var(--ca-paper,#eeece2)" stroke-width="1"/>
      <path d="m185 275 5-3v9l6-3m-11 6v5l11-6" stroke="var(--ca-paper,#eeece2)" stroke-width="1.5"/>
      <ellipse class="pe-led" cx="190" cy="291" rx="1.5" ry="2.2" fill="var(--ca-paper,#eeece2)" stroke="none"/>
    </g>
  </g>
</svg>
