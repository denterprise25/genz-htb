<svg class="ct-wireshark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" role="img" aria-labelledby="ws-art-title ws-art-desc">
<title id="ws-art-title">Wireshark packet inspection table</title>
<desc id="ws-art-desc">Copies of captured packets flow into an inspection table. A selected packet is highlighted and its protocol layers separate under a magnifying lens.</desc>
<style>
.ct-wireshark .ws-flow{stroke-dasharray:5 14;animation:ct-ws-flow calc(5s / var(--ct-speed,1)) linear infinite}
.ct-wireshark .ws-incoming{animation:ct-ws-arrive calc(5s / var(--ct-speed,1)) ease-in-out infinite}
.ct-wireshark .ws-incoming-two{animation-delay:-2.5s}
.ct-wireshark .ws-lens-float{animation:ct-ws-lens calc(6s / var(--ct-speed,1)) ease-in-out infinite}
.ct-wireshark .ws-layer-top,.ct-wireshark .ws-layer-mid,.ct-wireshark .ws-layer-low,.ct-wireshark .ws-lens-position{transition:transform .8s cubic-bezier(.2,.7,.25,1)}
.ct-wireshark .ws-highlight{opacity:.2;transition:opacity .8s}
.ct-wireshark .ws-details{opacity:.2;transition:opacity .8s}
.ct-product[data-step="1"] .ct-wireshark .ws-highlight,.ct-product[data-step="2"] .ct-wireshark .ws-highlight{opacity:1}
.ct-product[data-step="1"] .ct-wireshark .ws-layer-top{transform:translateY(-12px)}
.ct-product[data-step="2"] .ct-wireshark .ws-layer-top{transform:translateY(-61px)}
.ct-product[data-step="2"] .ct-wireshark .ws-layer-mid{transform:translateY(-30px)}
.ct-product[data-step="2"] .ct-wireshark .ws-layer-low{transform:translateY(3px)}
.ct-product[data-step="2"] .ct-wireshark .ws-lens-position{transform:translate(0,-17px)}
.ct-product[data-step="2"] .ct-wireshark .ws-details{opacity:1}
.ct-product[data-playing="false"] .ct-wireshark *{animation-play-state:paused!important}
@keyframes ct-ws-flow{to{stroke-dashoffset:-76}}
@keyframes ct-ws-arrive{0%,100%{transform:translate(-10px,-6px)}50%{transform:translate(18px,10px)}}
@keyframes ct-ws-lens{0%,100%{transform:translateX(-4px)}50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.ct-wireshark *{animation:none!important;transition:none!important}}
</style>
